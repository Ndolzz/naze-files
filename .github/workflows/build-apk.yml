name: Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest runners ship with the Android SDK preinstalled, but
      # sdkmanager is NOT on PATH (the old android-actions/setup-android
      # action added it, and that action is broken on Node 24 runners).
      # Locate it under $ANDROID_HOME and install what the build needs.
      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
          SDKM="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            SDKM="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          if [ -z "$SDKM" ] || [ ! -x "$SDKM" ]; then
            echo "sdkmanager not found under $ANDROID_HOME" >&2
            ls -R "${ANDROID_HOME}/cmdline-tools" || true
            exit 1
          fi
          echo "Using sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-35" "build-tools;35.0.0"

      # This project intentionally ships without gradlew / gradle-wrapper.jar
      # (a binary that must be fetched from Gradle's servers — see README).
      # setup-gradle provisions a verified Gradle distribution directly and
      # also handles caching, so no separate cache step is needed.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: naze-files-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
