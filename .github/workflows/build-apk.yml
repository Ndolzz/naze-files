name: Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest runners ship with the Android SDK preinstalled. The
      # android-actions/setup-android action broke once runners forced
      # Node 24, so install the required SDK pieces with sdkmanager directly.
      - name: Set up Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" > /dev/null

      # This project intentionally ships without gradlew / gradle-wrapper.jar
      # (a binary that must be fetched from Gradle's servers — see README).
      # setup-gradle provisions a verified Gradle distribution directly and
      # also handles caching, so no separate cache step is needed.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: naze-files-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
